<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encuesta de Salud</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:cursive;
    background:linear-gradient(135deg,#001f3f,#0074D9,#7FDBFF);
}

.formulario{
    width:350px;
    background:rgba(255,255,255,0.12);
    padding:25px;
    border-radius:20px;
    backdrop-filter:blur(10px);
    box-shadow:0 0 20px rgba(0,0,0,0.4);
    color:white;
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#7FDBFF;
}

label{
    display:block;
    margin-top:12px;
    font-size:18px;
}

input, select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

input[type="range"]{
    padding:0;
}

.valor{
    text-align:center;
    font-size:20px;
    color:#7FDBFF;
    margin-top:5px;
}

button{
    width:100%;
    margin-top:20px;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#001f3f;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#7FDBFF;
    color:#001f3f;
}
</style>
</head>

<body>

<div class="formulario">

<h2>Encuesta de Salud</h2>

<form>

<label>Nombre:</label>
<input type="text" required>

<label>Edad (1 - 100):</label>
<input type="number" min="1" max="100" required>

<label>Peso en kg (30 - 200):</label>
<input type="number" min="30" max="200" required>

<label>Altura en cm (100 - 250):</label>
<input type="number" min="100" max="250" required>

<label>Nivel de dolor:</label>
<input type="range" min="0" max="10" value="5" id="dolor" oninput="mostrarValor(this.value)">

<div class="valor" id="valorDolor">5</div>

<label>Tipo de sangre:</label>
<select required>
    <option value="">Selecciona tu tipo</option>
    <option>A+</option>
    <option>A-</option>
    <option>B+</option>
    <option>B-</option>
    <option>AB+</option>
    <option>AB-</option>
    <option>O+</option>
    <option>O-</option>
</select>

<button type="submit">Enviar Encuesta</button>

</form>
</div>

<script>
function mostrarValor(valor){
    document.getElementById("valorDolor").innerHTML = valor;
}
</script>

</body>
</html>
